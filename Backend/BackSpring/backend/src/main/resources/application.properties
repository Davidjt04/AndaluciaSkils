spring.application.name=backend
# Configuración para una base de datos MySQL
spring.datasource.url=jdbc:mysql://3307:3307/andaluciaskills
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Configuración para H2 (para pruebas en memoria)
spring.jpa.show-sql=true               
spring.jpa.properties.hibernate.format_sql=true  

# Coonfiguración para que spring sepa la sintaxis que si usa en el gbd que usemos
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect

